name: Deploy to ECS
description: Run migrations as a one-off ECS task, then roll the api/worker/web services to a new image tag.
inputs:
  environment: { required: true, description: staging | production }
  tag: { required: true, description: image tag }
  role-arn: { required: true, description: IAM role to assume via OIDC }
  region: { required: true, description: AWS region }
runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.region }}
    - name: Deploy
      shell: bash
      env:
        ENV: ${{ inputs.environment }}
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        CLUSTER="praxis-${ENV}"
        REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION:-${{ inputs.region }}}.amazonaws.com"
        update_td () {   # family, container, image → new task definition ARN
          aws ecs describe-task-definition --task-definition "$1" --query taskDefinition > td.json
          jq --arg IMG "$3" --arg C "$2" '.containerDefinitions |= map(if .name == $C or ($C == "*") then .image = $IMG else . end)
            | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' td.json > td-new.json
          aws ecs register-task-definition --cli-input-json file://td-new.json --query taskDefinition.taskDefinitionArn --output text
        }
        API_IMG="${REGISTRY}/praxis-api:${TAG}"; WEB_IMG="${REGISTRY}/praxis-web:${TAG}"
        NET=$(aws ecs describe-services --cluster "$CLUSTER" --services api --query 'services[0].networkConfiguration' --output json)
        run_once () {   # task definition ARN, label → fails the job if the task exits non-zero
          TASK=$(aws ecs run-task --cluster "$CLUSTER" --launch-type FARGATE --task-definition "$1" \
            --network-configuration "$NET" --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK"
          CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" --query 'tasks[0].containers[0].exitCode' --output text)
          [ "$CODE" = "0" ] || { echo "$2 failed (exit $CODE)"; exit 1; }
        }
        # Extensions + non-superuser app role (idempotent), then migrations, before any service moves.
        run_once "$(update_td "${CLUSTER}-db-bootstrap" db-bootstrap "$API_IMG")" "Database bootstrap"
        run_once "$(update_td "${CLUSTER}-migrate" migrate "$API_IMG")" "Migration"
        aws ecs update-service --cluster "$CLUSTER" --service api --task-definition "$(update_td "${CLUSTER}-api" api "$API_IMG")" >/dev/null
        aws ecs update-service --cluster "$CLUSTER" --service worker --task-definition "$(update_td "${CLUSTER}-worker" '*' "$API_IMG")" >/dev/null
        aws ecs update-service --cluster "$CLUSTER" --service web --task-definition "$(update_td "${CLUSTER}-web" web "$WEB_IMG")" >/dev/null
        aws ecs wait services-stable --cluster "$CLUSTER" --services api worker web
        echo "Deployed ${TAG} to ${ENV}"
